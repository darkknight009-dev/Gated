name: gated-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx next typegen
      - run: npm exec tsc -- --noEmit --pretty false
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
        env:
          APP_URL: http://localhost:3000
